general {
    grace = 2
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# ── Clock ────────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(240, 240, 245, 1.0)
    font_size = 88
    font_family = JetBrainsPropo Nerd Font
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# ── Date ─────────────────────────────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(107, 107, 120, 1.0)
    font_size = 15
    font_family = JetBrainsPropo Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# ── User ─────────────────────────────────────────────────────────────────────

label {
    monitor =
    text =   $USER
    color = rgba(107, 107, 120, 0.9)
    font_size = 12
    font_family = JetBrainsPropo Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

# ── Input field ───────────────────────────────────────────────────────────────

input-field {
    monitor =
    size = 260, 46
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(181, 123, 238, 1.0)
    inner_color = rgba(19, 19, 22, 0.88)
    font_color = rgba(240, 240, 245, 1.0)
    check_color = rgba(181, 123, 238, 1.0)
    fail_color = rgba(220, 80, 80, 1.0)
    fade_on_empty = true
    placeholder_text = <span foreground="##6b6b78"><i>password</i></span>
    hide_input = false
    rounding = 6
    fail_text = <i>$ATTEMPTS attempt(s)</i>
    capslock_color = rgba(255, 180, 50, 1.0)
    position = 0, -130
    halign = center
    valign = center
}
