general {
    gaps_in     = 2
    gaps_out    = 2
    border_size = 1
    col.active_border   = rgb(0a0a0a)
    col.inactive_border = rgb(050505)

    resize_on_border     = true
    hover_icon_on_border = false
}

decoration {
    rounding         = 0
    active_opacity   = 1.0
    inactive_opacity = 0.95

    dim_inactive         = true
    dim_strength         = 0.1
    dim_special          = 0.2

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}