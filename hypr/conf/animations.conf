animations {
    enabled = yes

    bezier = fade, 1, 1, 1, 1

    animation = windows,   1, 3,  fade, slide vert
    animation = windowsIn,  1, 3,  fade, slide vert
    animation = windowsOut, 1, 3,  fade, slide vert
    animation = borders,    1, 4,  fade
    animation = fade,        1, 4,  fade
    animation = workspaces, 1, 4,  fade
}