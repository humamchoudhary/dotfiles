# ~/.config/hypr/hyprtoolkit.conf
# Vanta Black Theme

# Main Colors
background=0xFF000000        # Pure Vanta Black background
base=0xFF000000              # Base elements - pure black
alternate_base=0xFF111111    # Slightly lighter black for contrast
text=0xFFFFFFFF              # Pure white foreground text
bright_text=0xFFFDFDFD       # Bright text using your specified border color
accent=0xFFFDFDFD            # Primary accent/border color (#fdfdfd)
accent_secondary=0xFFEEEEEE  # Secondary accent - slightly off-white

# Borders (since accent color controls borders/highlights)
# The accent color (#fdfdfd) will appear as borders and highlights

# Font sizes
font_size=12
small_font_size=10
h1_size=22
h2_size=18
h3_size=14

# Font families
font_family=Inter
font_family_monospace=JetBrainsMono Nerd Font

# Icon theme (with caveats - see below)
icon_theme=Papirus


window_size = 550 800

